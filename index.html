<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ひらがな・絵あわせパズル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #e0f2fe 50%, #fbcfe8 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .bounce-hover:hover { transform: scale(1.05); }
        .bounce-hover:active { transform: scale(0.95); }

        @keyframes correct-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(3deg); }
            100% { transform: scale(1); }
        }
        .animate-correct { animation: correct-pop 0.4s ease-out; }

        @keyframes wrong-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-wrong { animation: wrong-shake 0.4s ease-in-out; }

        #confetti-canvas {
            pointer-events: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased overflow-x-hidden">

    <canvas id="confetti-canvas"></canvas>

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md shadow-md sticky top-0 z-40 px-4 py-3 border-b-4 border-yellow-300">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.showHome()">
                <div class="bg-amber-400 text-white w-10 h-10 rounded-2xl flex items-center justify-center font-black text-xl shadow-md transform -rotate-6">あ</div>
                <div>
                    <h1 class="font-black text-lg md:text-xl text-slate-800 tracking-wider">ひらがな絵あわせ</h1>
                    <p class="text-xs text-amber-600 font-bold hidden sm:block">しょうがく２ねんせい 向け</p>
                </div>
            </div>

            <div class="flex items-center gap-2 md:gap-3">
                <div class="bg-amber-100 text-amber-800 border-2 border-amber-300 px-2.5 py-1 rounded-full flex items-center gap-1 font-bold shadow-sm text-sm">
                    <i class="fa-solid font-black fa-star text-yellow-500 text-base"></i>
                    <span id="star-count">0</span>
                </div>
                <button onclick="app.openImageManager()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-2xl font-bold flex items-center gap-1.5 shadow-md bounce-hover transition-all text-xs md:text-sm">
                    <i class="fa-solid fa-image"></i><span>がぞう かんり</span>
                </button>
                <button onclick="app.openStickerBook()" class="bg-pink-400 hover:bg-pink-500 text-white px-3 py-1.5 rounded-2xl font-bold flex items-center gap-1.5 shadow-md bounce-hover transition-all text-xs md:text-sm">
                    <i class="fa-solid fa-book-bookmark text-amber-200"></i><span>シール</span>
                </button>
                <button id="sound-btn" onclick="app.toggleSound()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-full flex items-center justify-center shadow transition-all">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">
        <!-- ホーム画面 -->
        <section id="screen-home" class="space-y-6 text-center py-4">
            <div class="space-y-2">
                <span class="bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full">たのしく ひらがな を おぼえよう！</span>
                <h2 class="text-3xl md:text-4xl font-black text-slate-800 tracking-wide">どのゲーム で あそぶ？</h2>
            </div>
            <div class="bg-white/80 p-4 rounded-3xl shadow-lg border-2 border-amber-200 max-w-lg mx-auto">
                <label class="block text-sm font-bold text-slate-600 mb-2">ジャンル を えらんでね</label>
                <div class="grid grid-cols-3 sm:grid-cols-5 gap-2" id="category-selector"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-3xl mx-auto pt-2">
                <div onclick="app.startGame('pair')" class="bg-white rounded-3xl p-5 shadow-xl border-4 border-amber-300 hover:border-amber-400 transition-all cursor-pointer bounce-hover flex flex-col items-center text-center group">
                    <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center text-amber-500 text-3xl mb-3 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-hand-pointer"></i>
                    </div>
                    <span class="bg-amber-400 text-white text-xs font-bold px-2 py-0.5 rounded-md mb-1">おすすめ！</span>
                    <h3 class="text-xl font-extrabold text-slate-800 mb-1">ペアで タッチ</h3>
                    <p class="text-xs text-slate-500 font-bold">ことば と え を えらんで<br>ペア を つくろう！</p>
                </div>
                <!-- 4たく クイズ、きおく ゲームへのボタンは簡略化のため非表示、または未実装メッセージ -->
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="hidden flex-col items-center space-y-4">
            <div class="w-full bg-white/80 backdrop-blur rounded-2xl p-3 shadow-md border border-slate-200 flex items-center justify-between">
                <button onclick="app.showHome()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 transition">
                    <i class="fa-solid fa-arrow-left"></i> もどる
                </button>
                <div class="flex items-center gap-3">
                    <span id="game-category-badge" class="bg-amber-100 text-amber-800 font-bold text-xs px-3 py-1 rounded-full">がっこう</span>
                    <div class="text-slate-600 font-bold text-sm">せいかい: <span id="game-score" class="text-amber-600 font-black text-lg">0</span> / <span id="game-total">5</span></div>
                </div>
            </div>
            <div id="game-board" class="w-full"></div>
        </section>

        <!-- リザルト画面 (モーダル) -->
        <div id="modal-result" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-300 space-y-5 animate-correct">
                <div class="text-5xl text-yellow-400"><i class="fa-solid fa-crown animate-bounce"></i></div>
                <div>
                    <h3 class="text-2xl font-black text-slate-800">たいへん よくできました！</h3>
                    <p class="text-slate-500 font-bold text-sm mt-1">ぜんぶ せいかい できたよ！</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="app.showHome()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-2xl font-bold transition">メニュー</button>
                    <button onclick="app.replayGame()" class="flex-1 bg-amber-400 hover:bg-amber-500 text-white py-3 rounded-2xl font-black shadow-md transition bounce-hover">もういちど</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 【変更点1】がっこうジャンルのアイテムを画像に合わせました
        const BASE_WORD_DATA = {
            school: {
                name: 'がっこう',
                icon: 'fa-school',
                items: [
                    { word: 'らんどせる', emoji: '🎒' },
                    { word: 'ぼうし', emoji: '👒' },
                    { word: 'ふでばこ', emoji: '👝' },
                    { word: 'つくえ', emoji: '🏫' },
                    { word: 'いす', emoji: '🪑' },
                    { word: 'えんぴつ', emoji: '✏️' },
                    { word: 'けしごむ', emoji: '⬜' },
                    { word: 'はさみ', emoji: '✂️' },
                    { word: 'のり', emoji: '🧴' },
                    { word: 'しゅーず', emoji: '👟' }
                ]
            },
            animals: {
                name: 'どうぶつ',
                icon: 'fa-paw',
                items: [
                    { word: 'いぬ', emoji: '🐶' }, { word: 'ねこ', emoji: '🐱' },
                    { word: 'うさぎ', emoji: '🐰' }, { word: 'くま', emoji: '🐻' },
                    { word: 'らいおん', emoji: '🦁' }, { word: 'ぞう', emoji: '🐘' }
                ]
            }
        };

        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playTone(freq, type, duration, delay = 0) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch (e) {}
                }, delay);
            }

            // 【変更点2】ピンポン・ブーの音に変更しました
            playCorrect() {
                this.playTone(783.99, 'sine', 0.3, 0);   
                this.playTone(659.25, 'sine', 0.5, 300); 
            }

            playWrong() {
                this.playTone(150, 'sawtooth', 0.15, 0);
                this.playTone(150, 'sawtooth', 0.4, 200);
            }

            playFlip() {
                this.playTone(400, 'triangle', 0.08, 0);
            }

            speak(text) {
                if (!this.enabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ja-JP';
                utter.rate = 0.85;
                window.speechSynthesis.speak(utter);
            }
        }

        class HiraganaApp {
            constructor() {
                this.sound = new SoundSystem();
                this.selectedCategory = 'school';
                this.currentMode = null;
                this.stars = parseInt(localStorage.getItem('hiragana_stars') || '0');
                this.customItems = JSON.parse(localStorage.getItem('hiragana_custom_items') || '[]');
                
                this.score = 0;
                this.totalQuestions = 5;
                this.currentPool = [];
                this.selectedWordCard = null;
                this.selectedPictureCard = null;

                this.initUI();
            }

            getCombinedWordData() {
                const data = JSON.parse(JSON.stringify(BASE_WORD_DATA));
                this.customItems.forEach(item => {
                    if (data[item.category]) data[item.category].items.push(item);
                });
                return data;
            }

            initUI() {
                this.updateStarDisplay();
                this.renderCategories();
            }

            toggleSound() {
                this.sound.enabled = !this.sound.enabled;
                const btn = document.getElementById('sound-btn');
                if (this.sound.enabled) {
                    btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                    btn.className = 'bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-full flex items-center justify-center shadow transition-all';
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                    btn.className = 'bg-red-100 hover:bg-red-200 text-red-600 w-9 h-9 rounded-full flex items-center justify-center shadow transition-all';
                }
            }

            renderCategories() {
                const container = document.getElementById('category-selector');
                container.innerHTML = '';
                const wordData = this.getCombinedWordData();
                Object.keys(wordData).forEach(key => {
                    const cat = wordData[key];
                    const isSelected = key === this.selectedCategory;
                    const btn = document.createElement('button');
                    btn.onclick = () => {
                        this.selectedCategory = key;
                        this.sound.playFlip();
                        this.renderCategories();
                    };
                    btn.className = `p-2 rounded-2xl border-2 flex flex-col items-center justify-center gap-1 transition-all ${
                        isSelected ? 'border-amber-400 bg-amber-50 text-amber-900 shadow-md scale-105 font-black' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50 font-bold'
                    }`;
                    btn.innerHTML = `<i class="fa-solid ${cat.icon} text-lg"></i><span class="text-xs">${cat.name}</span>`;
                    container.appendChild(btn);
                });
            }

            updateStarDisplay() {
                document.getElementById('star-count').innerText = this.stars;
                localStorage.setItem('hiragana_stars', this.stars.toString());
            }

            showHome() {
                document.getElementById('screen-home').classList.remove('hidden');
                document.getElementById('screen-game').classList.add('hidden');
                document.getElementById('screen-game').classList.remove('flex');
                document.getElementById('modal-result').classList.add('hidden');
            }

            renderMediaHTML(item, extraClass = "w-12 h-12 object-contain") {
                if (item.image) return `<img src="${item.image}" alt="${item.word}" class="${extraClass} rounded-lg inline-block">`;
                return `<span>${item.emoji || '❓'}</span>`;
            }

            startGame(mode) {
                this.currentMode = mode;
                this.score = 0;
                this.selectedWordCard = null;
                this.selectedPictureCard = null;

                const categoryData = this.getCombinedWordData()[this.selectedCategory];
                document.getElementById('game-category-badge').innerText = categoryData.name;
                document.getElementById('game-score').innerText = '0';

                const shuffled = [...categoryData.items].sort(() => 0.5 - Math.random());
                
                if (mode === 'pair') {
                    this.totalQuestions = Math.min(5, shuffled.length); // 1回のゲームは5問
                    this.currentPool = shuffled.slice(0, this.totalQuestions);
                    document.getElementById('game-total').innerText = this.totalQuestions;
                    this.setupPairMatchGame();
                } else {
                    alert("このモードは現在準備中です！");
                    return;
                }

                document.getElementById('screen-home').classList.add('hidden');
                document.getElementById('screen-game').classList.remove('hidden');
                document.getElementById('screen-game').classList.add('flex');
            }

            replayGame() {
                document.getElementById('modal-result').classList.add('hidden');
                this.startGame(this.currentMode);
            }

            setupPairMatchGame() {
                const board = document.getElementById('game-board');
                board.innerHTML = '';

                const words = [...this.currentPool].sort(() => 0.5 - Math.random());
                const pictures = [...this.currentPool].sort(() => 0.5 - Math.random());

                const container = document.createElement('div');
                container.className = 'grid grid-cols-2 gap-4 max-w-xl mx-auto';

                const leftCol = document.createElement('div');
                leftCol.className = 'space-y-3';
                words.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'pair-word-card w-full bg-white border-4 border-amber-200 p-3 rounded-2xl shadow-md flex items-center justify-between text-2xl font-black text-slate-800 bounce-hover';
                    btn.innerHTML = `<span>${item.word}</span><i class="fa-solid fa-volume-high text-amber-400 text-sm" onclick="event.stopPropagation(); app.sound.speak('${item.word}')"></i>`;
                    btn.onclick = () => this.handlePairWordSelect(btn, item);
                    leftCol.appendChild(btn);
                });

                const rightCol = document.createElement('div');
                rightCol.className = 'space-y-3';
                pictures.forEach(item => {
                    const btn = document.createElement('button');
                    // 【変更点3】aspect-square（正方形）、text-7xl に変更しカードを大きくしました
                    btn.className = 'pair-pic-card w-full bg-white border-4 border-cyan-200 p-2 rounded-2xl shadow-md flex items-center justify-center text-7xl bounce-hover aspect-square';
                    btn.innerHTML = this.renderMediaHTML(item, "w-24 h-24 object-contain");
                    btn.onclick = () => this.handlePairPicSelect(btn, item);
                    rightCol.appendChild(btn);
                });

                container.appendChild(leftCol);
                container.appendChild(rightCol);
                board.appendChild(container);
            }

            handlePairWordSelect(btn, item) {
                if (btn.classList.contains('matched')) return;
                this.sound.speak(item.word);
                this.sound.playFlip();

                document.querySelectorAll('.pair-word-card').forEach(b => {
                    if (!b.classList.contains('matched')) b.className = b.className.replace(/border-amber-500|bg-amber-100/g, '') + ' border-amber-200 bg-white';
                });

                btn.classList.add('border-amber-500', 'bg-amber-100');
                this.selectedWordCard = { btn, item };
                this.checkPairMatch();
            }

            handlePairPicSelect(btn, item) {
                if (btn.classList.contains('matched')) return;
                this.sound.playFlip();

                document.querySelectorAll('.pair-pic-card').forEach(b => {
                    if (!b.classList.contains('matched')) b.className = b.className.replace(/border-cyan-500|bg-cyan-100/g, '') + ' border-cyan-200 bg-white';
                });

                btn.classList.add('border-cyan-500', 'bg-cyan-100');
                this.selectedPictureCard = { btn, item };
                this.checkPairMatch();
            }

            // 【補完箇所】途切れていた正誤判定・処理のプログラムを追加しました
            checkPairMatch() {
                if (!this.selectedWordCard || !this.selectedPictureCard) return;

                if (this.selectedWordCard.item.word === this.selectedPictureCard.item.word) {
                    // 正解の場合
                    this.sound.playCorrect();
                    [this.selectedWordCard.btn, this.selectedPictureCard.btn].forEach(btn => {
                        btn.classList.add('opacity-50', 'matched', 'pointer-events-none');
                        btn.classList.remove('border-amber-500', 'bg-amber-100', 'border-cyan-500', 'bg-cyan-100');
                        btn.classList.add('bg-slate-100');
                    });
                    
                    this.score++;
                    document.getElementById('game-score').innerText = this.score;
                    this.selectedWordCard = null;
                    this.selectedPictureCard = null;

                    // 全問正解したかのチェック
                    if (this.score >= this.totalQuestions) {
                        setTimeout(() => {
                            this.stars += 1;
                            this.updateStarDisplay();
                            document.getElementById('modal-result').classList.remove('hidden');
                        }, 500);
                    }
                } else {
                    // 不正解の場合
                    this.sound.playWrong();
                    const wBtn = this.selectedWordCard.btn;
                    const pBtn = this.selectedPictureCard.btn;
                    
                    wBtn.classList.add('animate-wrong', 'border-red-400', 'bg-red-50');
                    pBtn.classList.add('animate-wrong', 'border-red-400', 'bg-red-50');
                    
                    setTimeout(() => {
                        wBtn.classList.remove('animate-wrong', 'border-red-400', 'bg-red-50', 'border-amber-500', 'bg-amber-100');
                        wBtn.classList.add('border-amber-200', 'bg-white');
                        
                        pBtn.classList.remove('animate-wrong', 'border-red-400', 'bg-red-50', 'border-cyan-500', 'bg-cyan-100');
                        pBtn.classList.add('border-cyan-200', 'bg-white');
                        
                        this.selectedWordCard = null;
                        this.selectedPictureCard = null;
                    }, 500);
                }
            }
        }

        // アプリケーションの開始
        const app = new HiraganaApp();
    </script>
</body>
</html>
